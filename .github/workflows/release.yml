name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            bin: claude_tanks
            asset: claude_tanks-linux-x86_64
          - os: windows-latest
            bin: claude_tanks.exe
            asset: claude_tanks-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux GUI deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev
      - run: cargo build --release
      - shell: bash
        run: cp target/release/${{ matrix.bin }} ${{ matrix.asset }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
