[package]
name = "jvm2rs"
version = "0.1.0"
edition = "2024"
description = "Translates JVM bytecode (class files and jars) into Rust source"

[dependencies]
jrt = { path = "../jrt" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
